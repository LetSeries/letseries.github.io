<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="页面不存在 · LetSeries">
	<meta name="robots" content="noindex">
	<title>404 · 页面不存在 · LetSeries</title>
	<link rel="icon" type="image/png" href="images/LetSeries.png">
	<style>
		:root { color-scheme: light dark; --bg: #f4f7f1; --text: #17231c; --muted: #647067; --green: #16834b; --line: #d7e0d5; --surface: #fff; }
		@media (prefers-color-scheme: dark) { :root { --bg: #111813; --text: #edf5eb; --muted: #a6b7a9; --green: #56ce83; --line: #304436; --surface: #18241b; } }
		* { box-sizing: border-box; }
		body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: var(--text); background: var(--bg); font-family: "Noto Sans SC", system-ui, sans-serif; }
		.card { max-width: 520px; padding: 48px; text-align: center; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
		.code { color: var(--green); font-family: monospace; font-size: 14px; font-weight: 700; }
		h1 { margin: 12px 0; font-size: 40px; letter-spacing: -.04em; }
		p { color: var(--muted); font-size: 14px; }
		.actions { display: flex; justify-content: center; gap: 12px; margin-top: 28px; flex-wrap: wrap; }
		a.button { display: inline-flex; padding: 10px 16px; border-radius: 7px; font-size: 14px; font-weight: 700; text-decoration: none; }
		a.primary { color: #fff; background: var(--green); }
		a.quiet { border: 1px solid var(--line); color: var(--text); }
	</style>
</head>
<body>
	<div class="card">
		<div class="code">404 / NOT FOUND</div>
		<h1>这个页面走丢了</h1>
		<p>链接可能已移动或从未存在。回首页看看项目和博客吧。</p>
		<div class="actions"><a class="button primary" href="/">回首页</a><a class="button quiet" href="/blogs/index.html">看博客</a></div>
	</div>
</body>
</html>
